<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
  <title>学習問題集</title>

  <script>
    const VERSION = Date.now();

    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "style.css?v=" + VERSION;
    document.head.appendChild(css);
  </script>
</head>

<body>
  <main class="stage" id="app"></main>

  <script>
    const questions = document.createElement("script");
    questions.src = "questions-main.js?v=" + VERSION;

    questions.onload = () => {
      const appScript = document.createElement("script");
      appScript.src = "app.js?v=" + VERSION;
      document.body.appendChild(appScript);
    };

    document.body.appendChild(questions);
  </script>
</body>
</html>

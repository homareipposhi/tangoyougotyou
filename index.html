<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
  <title>学習問題集</title>

  <script>
    const VERSION = Date.now();

    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "css/style.css?v=" + VERSION;
    document.head.appendChild(css);
  </script>
</head>

<body>
  <main class="stage" id="app"><p class="empty" id="load-status" role="status">問題データを読み込んでいます。</p></main>

  <script>
    const loader = document.createElement("script");
    loader.src = "js/loader.js?v=" + VERSION;
    loader.onerror = () => {
      document.getElementById("load-status").textContent = "アプリを読み込めませんでした。通信状態を確認して再読み込みしてください。";
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>

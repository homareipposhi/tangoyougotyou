<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Weather Dashboard</h1>
      <p>Fetches weather data from Open-Meteo (no API key required)</p>
    </header>

    <main>
      <section class="search">
        <input id="city-input" placeholder="Enter city (e.g. Tokyo)" />
        <button id="search-btn">Search</button>
        <button id="geo-btn">Use my location</button>
      </section>

      <section id="status" class="hidden"></section>

      <section id="current" class="card hidden">
        <h2>Current</h2>
        <div id="current-content"></div>
      </section>

      <section id="forecast" class="card hidden">
        <h2>7-day Forecast</h2>
        <div id="forecast-content" class="grid"></div>
      </section>
    </main>

    <footer>
      <small>Data from <a href="https://open-meteo.com/">Open-Meteo</a></small>
    </footer>

    <script src="app.js"></script>
  </body>
</html>

name: Validate and publish study app

on:
  push:
    paths:
      - 'subjects/**/*.js'
      - 'scripts/*.mjs'
      - 'js/*.js'
      - 'css/**/*.css'
      - 'index.html'
      - '.github/workflows/generate-manifest.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-manifest.mjs
      - run: node scripts/validate-question-banks.mjs
      - run: node scripts/test-app.mjs
      - name: Commit generated manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/generated-manifest.js
          git diff --cached --quiet || git commit -m 'chore: regenerate subject manifest'
          git push
      - name: Prepare public app files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js subjects _site/
      - name: Upload tested app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any branch-based Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'legacy') return;
            // A legacy build can overwrite the generated manifest with the pre-build version.
            // Keep existing Pages settings and publish our tested artifact after it finishes.
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(run => run.path === 'dynamic/pages/pages-build-deployment');
              if (legacy.length && legacy.every(run => run.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for the existing Pages build.');
      - name: Publish tested app
        id: deployment
        uses: actions/deploy-pages@v4
